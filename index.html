<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" href="./assets/icons/burgerIcon.png">

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <link rel="stylesheet" href="./css/variables.css">

    <script defer src="./js/db.js"></script>
    <script defer src="./js/templates.js"></script>
    <script defer src="./js/script.js"></script>

</head>
<body onload="init()">
    <header>
        <img src="./assets/icons/logo.png" alt="logo">
        <img src="./assets/icons/setting.png" alt="settings">
    </header>
    <main>
        <section class="landingpage">
            <img src="./assets/images/bg_landingpage.jpg" alt="background">
            <img src="./assets/images/Burgerlogo.png" alt="burgerlogo"> 
            <div class="info">
                <div class="headlineAndRating">
                    <h1>
                        <font color="#E76C1F">Burger</font>House
                    </h1>
                    <div class="rating" id="rating">
                        <img src="./assets/icons/star.png"> 
                        <span class="rate">
                            <b>4,1</b>
                        </span>
                        <span class="comments">
                            (317)
                        </span>
                    </div>
                </div>
                <p>
                    The best of Burgers, Pizza, and Greens, all in one great place.
                </p>
            </div>
        </section>
        <section class="content">
            <div class="dishHeadline">
                <img src="./assets/icons/burgerIcon.png"> 
                <h2>
                    Burgers & Sandwiches
                </h2>
            </div>
            <div class="menu">
                <div class="dishes" id="dishes">
                    
                </div>
            </div>
            <div class="basket" id="basket">
                <h2>Your Basket</h2>
                <!-- <p>
                    Nothing here yet.
                    Go ahead and choose something delicious!
                </p>
                <img src="./assets/icons/basket.png" alt="Basket">  -->
                <div class="basketContent">
                    <div class="basketDishes">
                        <div class="basketDish">
                            <p>
                                XX x Burgername
                            </p>
                            <div class="basketDishBottom">
                                <div class="basketDishBottomLeft">
                                    <img src="./assets/icons/delete.png">
                                    <span>1</span>
                                    <span>+</span>
                                </div>
                                <span>16,90€</span>
                            </div>
                        </div>
                    </div>
                    <div class="basketSum">
                        <div class="subtotal">
                            <span>Subtotal</span>
                            <span>XXXX€</span>
                        </div>
                        <div class="deliveryFee">
                            <span>Delivery fee</span>
                            <span>4,99€</span>
                        </div>
                        <div class="totalSum">
                            <span>Total</span>
                            <span>XXXX€</span>
                        </div>
                        <button>Buy now (XXX€)</button>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <span>Burgerhouse</span>
        <span>Imprint</span>
        <span>Cookie Preferences</span>
    </footer>
</body>
</html>
