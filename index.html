<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <link rel="stylesheet" href="./css/variables.css">

    <script defer src="./js/db.js"></script>
    <script defer src="./js/templates.js"></script>
    <script defer src="./js/script.js"></script>

</head>
<body>
    <header>
        <img src="./assets/icons/logo.png" alt="logo">
        <img src="./assets/icons/setting.png" alt="settings">
    </header>
    <main>
        <section class="landingpage">
            <img src="./assets/images/bg_landingpage.jpg" alt="background">
            <img src="./assets/images/Burgerlogo.png" alt="burgerlogo"> 
            <div class="info">
                <div class="headlineAndRating">
                    <h1>
                        <font color="#E76C1F">Burger</font>House
                    </h1>
                    <div class="rating">
                        <img src="./assets/icons/star.png"> 
                        <span class="rate"><b>4,1</b></span>
                        <span class="comments">(317)</span>
                    </div>
                </div>
                <p>
                    The best of Burgers, Pizza, and Greens, all in one great place.
                </p>
            </div>
        </section>
        <section class="content">
            <div class="menu">
                <div class="dishHeadline">
                    <img> BurgerIcon
                    <h2>
                        Burgers & Sandwiches
                    </h2>
                </div>
                <div class="dishes">
                    <div class="dish1">
                        <img>dishImg
                        <div class="dishInfo">
                            <h3>
                                DishHeadline
                            </h3>
                            <h3>
                                Price
                            </h3>
                            <span>
                                ingredients
                            </span>
                            <button>Add to basket</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="basket">

            </div>
        </section>
    </main>
    <footer>
        <span>Burgerhouse</span>
        <span>Imprint</span>
        <span>Cookie Preferences</span>
    </footer>
</body>
</html>
